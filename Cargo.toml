[package]
name = "with-limits"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Oliver Steele <steele@osteele.com>"]
description = "Run a command with CPU, memory, and wall-time limits"
license = "MIT"
repository = "https://github.com/osteele/with-limits"
homepage = "https://github.com/osteele/with-limits"
readme = "README.md"
keywords = ["resource-limits", "cpu", "memory", "timeout", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "with-limits"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
sysinfo = "0.33"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
